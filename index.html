<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlobTown Browser</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        #Frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            background: white;
        }

        #Mod {
            position: fixed;
            right: 15px;
            bottom: 15px;
            z-index: 10;

            display: flex;
            gap: 6px;

            padding: 8px;
            border-radius: 10px;

            background: rgba(0, 0, 0, 0.85);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        button {
            border: none;
            border-radius: 7px;

            padding: 9px 14px;

            background: white;
            color: black;

            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #dddddd;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <!-- Website / BlobTown inventory -->
    <iframe
        id="Frame"
        title="BlobTown Browser">
    </iframe>

    <!-- Mod controls -->
    <div id="Mod">
        <button onclick="openInventory()">
            Inventory
        </button>

        <button onclick="openBrowser()">
            Browser
        </button>
    </div>

    <script>
        // Get the BlobTown token from the URL.
        const params = new URLSearchParams(window.location.search);
        const blobt = params.get("blobt");

        // Get the iframe.
        const frame = document.getElementById("Frame");

        // Open the player's BlobTown inventory.
        function openInventory() {
            if (!blobt) {
                alert("No BlobTown token was found.");
                return;
            }

            frame.src =
                "https://app.blobtown.com/inventory?blobt=" +
                encodeURIComponent(blobt);
        }

        // Ask the user for a website and open it.
        function openBrowser() {
            let url = prompt("Enter website URL:");

            if (!url) {
                return;
            }

            // Add https:// if the user didn't enter a protocol.
            if (!/^https?:\/\//i.test(url)) {
                url = "https://" + url;
            }

            frame.src = url;
        }

        // Start on the inventory page.
        openInventory();

        console.log("BlobTown Browser Mod loaded.");
    </script>

</body>
</html>
